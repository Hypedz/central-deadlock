name: Atualizar notícias do Steam

# Roda todo dia às 12:00 UTC (09:00 no horário de Brasília) e também
# pode ser rodado na mão: aba "Actions" > "Atualizar notícias do Steam" > "Run workflow".
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Buscar as notícias oficiais do Deadlock
        run: python tools/update-news.py

      - name: Salvar as novidades no repositório
        run: |
          git config user.name "Central Deadlock Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/steam-news.js
          if git diff --staged --quiet; then
            echo "Nada mudou desde ontem."
          else
            git commit -m "Notícias atualizadas automaticamente"
            git push
          fi

name: Notícias do Steam + Discord

# Busca as notícias do Deadlock, posta as novidades no Discord e
# manda o site se republicar com as notícias novas.
#
# Todo dia às 12:00 UTC (09:00 no horário de Brasília) e também pode
# ser rodado na mão: aba "Actions" > "Notícias do Steam + Discord" > "Run workflow".
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # para salvar as notícias no repositório
      actions: write    # para pedir a republicação do site
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Buscar as notícias oficiais do Deadlock
        run: python tools/update-news.py

      - name: Postar as novidades no Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_PATCHES: ${{ secrets.DISCORD_WEBHOOK_PATCHES }}
          DISCORD_CARGO: ${{ secrets.DISCORD_CARGO }}
        run: python tools/discord-post.py
        continue-on-error: true

      - name: Salvar as novidades no repositório
        id: salvar
        run: |
          git config user.name "Central Deadlock Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/steam-news.js data/discord-posted.json
          if git diff --staged --quiet; then
            echo "Nada mudou desde a última vez."
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Notícias atualizadas automaticamente"
            git push
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Republicar o site com as notícias novas
        if: steps.salvar.outputs.mudou == 'sim'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "publicar-site.yml" --repo "${{ github.repository }}"

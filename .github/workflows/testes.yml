name: Testes do site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Perfil, privacidade, QR e cartões
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar os testes
        run: npm test
        env:
          CI: true

      - name: Guardar o relatório se algo falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview - Conquistas Redesenhadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Titan+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
    --bg: #0c0c0e;
    --bg-2: #111114;
    --card: #16161a;
    --card-2: #1c1c22;
    --card-hover: #1d1d22;
    --border: #232329;
    --border-2: #2e2e36;
    --lime: #b6f24a;
    --lime-rgb: 182, 242, 74;
    --on-lime: #0c0c0e;
    --lime-hover: color-mix(in srgb, var(--lime) 80%, #ffffff);
    --lime-dim: color-mix(in srgb, var(--lime) 14%, transparent);
    --text: #f2f2f5;
    --text-soft: #9a9aa6;
    --text-faint: #85858f;
    --danger: #ef4444;
    --info: #38bdf8;
    --ok: #34d399;
    --warn: #fbbf24;
    --cy: #22d3ee;
    --vio: #a78bfa;
    --font-ui: 'Poppins', system-ui, sans-serif;
    --font-text: 'Inter', system-ui, sans-serif;
    --font-hero: 'Titan One', 'Poppins', sans-serif;
    --radius: 18px;
    --trans: all 0.18s ease;
    --shadow: 0 10px 30px rgba(0,0,0,0.5);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: var(--font-text); min-height: 100vh; padding: 40px 20px; }
h1 { font-family: var(--font-ui); font-weight: 800; font-size: clamp(1.8rem, 4vw, 2.8rem); margin-bottom: 8px; background: linear-gradient(135deg, var(--text), var(--text-soft)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.subtitle { color: var(--text-soft); margin-bottom: 32px; max-width: 600px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }

/* ===== NOVA CONQUISTA CARD ===== */
.ach-new {
    position: relative;
    background: linear-gradient(145deg, var(--card-2), var(--card));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    transition: var(--trans);
    overflow: hidden;
}
.ach-new::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--border);
    transition: var(--trans);
}

/* Progress ring SVG */
.progress-ring {
    width: 88px; height: 88px;
    transform: rotate(-90deg);
    margin: 0 auto 4px;
}
.progress-ring-bg {
    fill: none; stroke: var(--border); stroke-width: 6;
}
.progress-ring-fg {
    fill: none; stroke: var(--lime); stroke-width: 6;
    stroke-linecap: round; stroke-dasharray: 251.2; stroke-dashoffset: 251.2;
    transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    filter: drop-shadow(0 0 8px var(--lime));
}

/* Locked state */
.ach-new.locked::before { background: var(--border); }
.ach-new.locked .progress-ring-fg { stroke: var(--border-2); filter: none; }
.ach-new.locked .medal {
    background: linear-gradient(145deg, var(--card), var(--card-2));
    border-color: var(--border);
    box-shadow: inset 0 0 0 1px var(--border-2);
}
.ach-new.locked .medal img { opacity: 0.4; filter: grayscale(1); }
.ach-new.locked .title { color: var(--text-faint); }
.ach-new.locked .desc { color: var(--text-faint); opacity: 0.7; }
.ach-new.locked .progress-text { color: var(--text-faint); }
.ach-new.locked .progress-bar { background: var(--border); }
.ach-new.locked .progress-fill { background: var(--border-2); }

/* Unlocked state */
.ach-new.unlocked::before { background: linear-gradient(90deg, var(--lime), var(--lime-hover)); box-shadow: 0 0 16px var(--lime); }
.ach-new.unlocked .medal {
    background: linear-gradient(160deg, var(--lime), var(--lime-hover));
    border-color: var(--lime);
    box-shadow: 0 0 24px -4px var(--lime), inset 0 0 0 1px rgba(255,255,255,0.3);
}
.ach-new.unlocked .medal img { opacity: 1; filter: none; }
.ach-new.unlocked .title { color: var(--text); }
.ach-new.unlocked .desc { color: var(--text-soft); }
.ach-new.unlocked .progress-text { color: var(--lime); font-weight: 700; }
.ach-new.unlocked .progress-bar { background: rgba(182, 242, 74, 0.15); }
.ach-new.unlocked .progress-fill { background: linear-gradient(90deg, var(--lime), var(--lime-hover)); box-shadow: 0 0 12px var(--lime); }
.ach-new.unlocked .progress-ring-fg { stroke: var(--lime); filter: drop-shadow(0 0 8px var(--lime)); }

/* Medal icon */
.medal {
    width: 88px; height: 88px;
    border-radius: 50%;
    display: grid; place-items: center;
    border: 2px solid var(--border);
    margin: 0 auto;
    position: relative;
    transition: var(--trans);
    overflow: hidden;
    background: linear-gradient(145deg, var(--card), var(--card-2));
}
.medal img {
    width: 72px; height: 72px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
}
.medal::after {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1px dashed var(--border);
    opacity: 0.5;
}
.unlocked .medal::after { border-color: var(--lime); opacity: 0.8; }

/* Text content */
.content { text-align: center; }
.title {
    font-family: var(--font-ui);
    font-weight: 800;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    line-height: 1.2;
    transition: var(--trans);
}
.desc {
    font-size: 12.5px;
    line-height: 1.5;
    max-width: 220px;
    margin: 0 auto;
    transition: var(--trans);
}

/* Progress bar */
.progress-wrap { display: flex; flex-direction: column; gap: 8px; }
.progress-bar {
    height: 8px;
    border-radius: 99px;
    overflow: hidden;
    position: relative;
}
.progress-fill {
    height: 100%;
    border-radius: 99px;
    width: 0%;
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}
.progress-text {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    transition: var(--trans);
}

/* Hover effects */
.ach-new:hover { transform: translateY(-4px); box-shadow: 0 16px 40px -12px rgba(0,0,0,0.6); }
.ach-new.unlocked:hover { box-shadow: 0 16px 40px -12px rgba(182,242,74,0.3); }

/* Rarity badges */
.rarity {
    position: absolute;
    top: 16px; right: 16px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 4px 8px;
    border-radius: 99px;
    opacity: 0.9;
}
.rarity-common { background: var(--border); color: var(--text-soft); }
.rarity-rare { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; }
.rarity-epic { background: linear-gradient(135deg, #a855f7, #7e22ce); color: white; }
.rarity-legendary { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #0c0c0e; }
.rarity-mythic { background: linear-gradient(135deg, #ef4444, #f97316, #fbbf24); background-size: 200% 200%; animation: mythic-shift 3s ease infinite; color: white; }
@keyframes mythic-shift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

/* Category icon */
.cat-icon {
    position: absolute;
    top: 16px; left: 16px;
    width: 28px; height: 28px;
    display: grid; place-items: center;
    border-radius: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-faint);
}
.unlocked .cat-icon { background: rgba(var(--lime-rgb), 0.2); border-color: var(--lime); color: var(--lime); }

/* List view */
.list-view .ach-new { flex-direction: row; align-items: center; text-align: left; padding: 16px 20px; gap: 16px; }
.list-view .medal { width: 64px; height: 64px; flex-shrink: 0; }
.list-view .progress-ring { width: 64px; height: 64px; }
.list-view .medal img { width: 52px; height: 52px; }
.list-view .content { flex: 1; min-width: 0; }
.list-view .title { text-align: left; }
.list-view .desc { text-align: left; margin: 4px 0 0; }
.list-view .progress-wrap { width: 180px; flex-shrink: 0; }
.list-view .progress-bar { height: 6px; }

/* Controls */
.controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 32px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 99px; border: 1px solid var(--border); background: var(--card-2); color: var(--text); font-family: var(--font-ui); font-weight: 600; font-size: 13px; cursor: pointer; transition: var(--trans); }
.btn:hover { border-color: var(--border-2); }
.btn.primary { background: var(--lime); border-color: var(--lime); color: var(--on-lime); }
.btn.primary:hover { background: var(--lime-hover); }

/* Stats bar */
.stats-bar { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; padding: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; max-width: 800px; margin-left: auto; margin-right: auto; }
.stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.stat-value { font-family: var(--font-ui); font-weight: 800; font-size: 2rem; color: var(--lime); }
.stat-label { font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.5px; }

/* Theme toggle */
.theme-toggle { position: fixed; top: 20px; right: 20px; z-index: 100; }
[data-theme="light"] {
    --bg: #f4f5f7; --bg-2: #ffffff; --card: #ffffff; --card-2: #f4f5f7;
    --card-hover: #f4f5f7; --border: #e4e6ea; --border-2: #d3d6dc;
    --text: #17171c; --text-soft: #5c5c68; --text-faint: #6b6b78;
    --lime: #3b5c02; --on-lime: #ffffff;
}
[data-theme="light"] .ach-new.locked .medal { background: linear-gradient(145deg, #fff, #f4f5f7); }
[data-theme="light"] .ach-new.unlocked::before { box-shadow: 0 0 16px var(--lime); }
</style>
</head>
<body>
<button class="theme-toggle btn" onclick="toggleTheme()"><i class="fa-solid fa-moon" id="themeIcon"></i> <span id="themeText">Tema</span></button>

<div class="controls">
    <button class="btn primary" onclick="setView('grid')"><i class="fa-solid fa-th"></i> Grid</button>
    <button class="btn" onclick="setView('list')"><i class="fa-solid fa-list"></i> Lista</button>
    <button class="btn" onclick="toggleAll()"><i class="fa-solid fa-lock-open"></i> <span id="toggleText">Desbloquear todas</span></button>
    <button class="btn" onclick="randomizeProgress()"><i class="fa-solid fa-dice"></i> Aleatório</button>
</div>

<div class="stats-bar">
    <div class="stat"><span class="stat-value" id="statDone">0</span><span class="stat-label">Desbloqueadas</span></div>
    <div class="stat"><span class="stat-value" id="statTotal">8</span><span class="stat-label">Total</span></div>
    <div class="stat"><span class="stat-value" id="statPct">0%</span><span class="stat-label">Completo</span></div>
</div>

<div class="grid" id="grid"></div>

<script>
// ===== DADOS DAS CONQUISTAS =====
const ACH_DATA = [
    { id: 'novato', name: 'Novato', desc: 'Escolha um apelido para o perfil.', image: 'assets/conquistas/novato.webp', icon: 'fa-seedling', category: 'Perfil', rarity: 'common', progress: () => ({ cur: 0, max: 1 }) },
    { id: 'explorador', name: 'Explorador', desc: 'Visite 8 páginas diferentes do site.', image: 'assets/conquistas/explorador.webp', icon: 'fa-compass', category: 'Exploração', rarity: 'common', progress: () => ({ cur: 3, max: 8 }) },
    { id: 'conhecedor', name: 'Conhecedor', desc: 'Abra a página de 10 heróis diferentes.', image: 'assets/conquistas/conhecedor.webp', icon: 'fa-book', category: 'Heróis', rarity: 'rare', progress: () => ({ cur: 6, max: 10 }) },
    { id: 'completista', name: 'Completista', desc: 'Abra a página de todos os heróis lançados.', image: 'assets/conquistas/completista.webp', icon: 'fa-check-double', category: 'Heróis', rarity: 'epic', progress: () => ({ cur: 12, max: 43 }) },
    { id: 'colecionador', name: 'Colecionador', desc: 'Favorite 5 heróis como principais.', image: 'assets/conquistas/colecionador.webp', icon: 'fa-star', category: 'Perfil', rarity: 'rare', progress: () => ({ cur: 2, max: 5 }) },
    { id: 'personalizador', name: 'Personalizador', desc: 'Personalize 6 itens do seu perfil.', image: 'assets/conquistas/personalizador.webp', icon: 'fa-palette', category: 'Customização', rarity: 'epic', progress: () => ({ cur: 4, max: 6 }) },
    { id: 'coruja', name: 'Coruja', desc: 'Use o site de madrugada (0h às 5h).', image: 'assets/conquistas/coruja.webp', icon: 'fa-moon', category: 'Secreto', rarity: 'legendary', progress: () => ({ cur: 0, max: 1 }) },
    { id: 'lenda', name: 'Lenda', desc: 'Chegue ao nível 5 do perfil.', image: 'assets/conquistas/lenda.webp', icon: 'fa-crown', category: 'Progressão', rarity: 'mythic', progress: () => ({ cur: 3, max: 5 }) },
];

let allUnlocked = false;
let viewMode = 'grid';

function calcProgress(a) {
    const p = a.progress();
    return { ...p, pct: Math.round(p.cur / p.max * 100) };
}

function isUnlocked(a) {
    const p = a.progress();
    return p.cur >= p.max;
}

function renderAchievement(a) {
    const p = calcProgress(a);
    const unlocked = p.cur >= p.max && !a.forceLocked;
    const effectiveUnlocked = allUnlocked || unlocked;
    
    const circumference = 2 * Math.PI * 40; // 251.2
    const offset = circumference * (1 - p.pct / 100);
    
    return `
    <article class="ach-new ${effectiveUnlocked ? 'unlocked' : 'locked'}" data-id="${a.id}">
        <span class="cat-icon"><i class="fa-solid ${a.category === 'Perfil' ? 'fa-user' : a.category === 'Heróis' ? 'fa-shield' : a.category === 'Exploração' ? 'fa-map' : a.category === 'Customização' ? 'fa-palette' : a.category === 'Progressão' ? 'fa-chart-line' : a.category === 'Secreto' ? 'fa-eye' : 'fa-star'}"></i></span>
        <span class="rarity rarity-${a.rarity}">${a.rarity.charAt(0).toUpperCase() + a.rarity.slice(1)}</span>
        <div class="medal">
            <svg class="progress-ring" viewBox="0 0 88 88">
                <circle class="progress-ring-bg" cx="44" cy="44" r="40"></circle>
                <circle class="progress-ring-fg" cx="44" cy="44" r="40" style="stroke-dashoffset: ${effectiveUnlocked ? 0 : offset}"></circle>
            </svg>
            <img src="${a.image}" alt="${a.name}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
            <i class="fa-solid ${a.icon}" style="display:none; font-size: 30px; color: var(--text-faint);"></i>
        </div>
        <div class="content">
            <h3 class="title">${a.name}</h3>
            <p class="desc">${a.desc}</p>
            <div class="progress-wrap">
                <div class="progress-bar"><i class="progress-fill" style="width: ${p.pct}%"></i></div>
                <span class="progress-text">${effectiveUnlocked ? 'Concluída' : `${p.cur}/${p.max} (${p.pct}%)`}</span>
            </div>
        </div>
    </article>`;
}

function render() {
    const grid = document.getElementById('grid');
    grid.className = viewMode === 'list' ? 'grid list-view' : 'grid';
    grid.innerHTML = ACH_DATA.map(renderAchievement).join('');
    
    // Stats
    const done = ACH_DATA.filter(a => isUnlocked(a) || allUnlocked).length;
    const total = ACH_DATA.length;
    document.getElementById('statDone').textContent = done;
    document.getElementById('statPct').textContent = Math.round(done / total * 100) + '%';
    
    // Animate progress rings
    document.querySelectorAll('.ach-new.unlocked .progress-ring-fg').forEach((el, i) => {
        setTimeout(() => { el.style.strokeDashoffset = '0'; }, i * 100);
    });
}

function setView(mode) {
    viewMode = mode;
    document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('primary'));
    document.querySelector(`.controls .btn[onclick*="${mode}"]`).classList.add('primary');
    render();
}

function toggleAll() {
    allUnlocked = !allUnlocked;
    document.getElementById('toggleText').textContent = allUnlocked ? 'Bloquear todas' : 'Desbloquear todas';
    render();
}

function randomizeProgress() {
    ACH_DATA.forEach(a => {
        if (a.id === 'novato') return;
        const p = a.progress();
        a.forceProgress = Math.floor(Math.random() * (p.max + 1));
        a.progress = () => ({ cur: a.forceProgress, max: p.max });
    });
    allUnlocked = false;
    document.getElementById('toggleText').textContent = 'Desbloquear todas';
    render();
}

function toggleTheme() {
    const html = document.documentElement;
    const isLight = html.dataset.theme === 'light';
    html.dataset.theme = isLight ? 'dark' : 'light';
    document.getElementById('themeIcon').className = isLight ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
    document.getElementById('themeText').textContent = isLight ? 'Tema escuro' : 'Tema claro';
}

// Init
render();
</script>
</body>
</html>
